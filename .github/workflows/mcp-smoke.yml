name: MCP Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          server.py wb.py proxy/rotator.py
          scripts/supervisor.py scripts/smoke_mcp.py scripts/validate_xray_configs.py

      - name: Build Docker image
        run: docker build -t wildberries-tools-mcp:ci .

      - name: Validate generated VLESS configs with bundled Xray core
        run: >-
          docker run --rm
          --entrypoint python
          wildberries-tools-mcp:ci
          scripts/validate_xray_configs.py

      - name: Start MCP container without public VLESS dependency
        run: |
          docker run -d \
            --name wildberries-tools-mcp-ci \
            -e XRAY_ENABLED=false \
            -e MCP_TRANSPORT=streamable-http \
            -e MCP_HOST=0.0.0.0 \
            -e MCP_PORT=8000 \
            -e MCP_PATH=/mcp \
            -e MCP_STATELESS_HTTP=true \
            -e MCP_TRUST_PROXY=true \
            -p 8000:8000 \
            wildberries-tools-mcp:ci

      - name: Run real MCP handshake and tools/list
        env:
          MCP_SMOKE_URL: http://127.0.0.1:8000/mcp
          MCP_SMOKE_ATTEMPTS: "30"
          MCP_SMOKE_DELAY: "1"
        run: python scripts/smoke_mcp.py

      - name: Show container logs
        if: always()
        run: docker logs wildberries-tools-mcp-ci || true
